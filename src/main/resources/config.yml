database:
  type: sqlite
  table-prefix: sopchat_
  sqlite-file: chat.db
  host: 127.0.0.1
  port: 3306
  database: minecraft
  username: root
  password: ""
  pool-name: SopChat
  maximum-pool-size: 10
  minimum-idle: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

formatting:
  allow-colors: true
  allow-styles: true
  allow-magic: false
  allow-hex: true
  allow-minimessage: true
  allow-message-placeholders: true
  permissions:
    color: "sopchat.format.color"
    style: "sopchat.format.style"
    magic: "sopchat.format.magic"
    hex: "sopchat.format.hex"
    minimessage: "sopchat.format.minimessage"
    placeholders: "sopchat.format.placeholders"

anti-flood:
  enabled: true
  message-cooldown-seconds: 1.5
  bypass-permission: "sopchat.antiflood.bypass"

anti-repeat:
  enabled: true
  same-message-delay-seconds: 15
  normalize-case: true
  trim-extra-spaces: true

anti-spam:
  enabled: true
  block-ipv4: true
  block-domains: true
  bypass-permission: "sopchat.antispam.bypass"
  whitelist: []
  blacklist:
    - "discord.gg"
  regex-rules:
    - "(?i)https?://"

mentions:
  enabled: true
  hide-self-mention: true
  match-display-name: true
  ignore-case: true
  ignore-vanished-players: true
  mask: "&e@{display_name}"
  display-name-mask: "&e@{display_name}"
  play-sound: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 1.0
  pitch: 1.0

channels:
  enabled: true
  format: "&d[{channel}] &f{player}: {message}"
  limits:
    owned-per-player: 1
    members-per-channel: 20
  invites:
    expire-seconds: 300
    minimessage-buttons: true
  history:
    enabled: true
    store-limit: 100
    preview-on-open: 10
    retention-days: 7
  unread:
    enabled: true
    notify-on-join: true

private-messages:
  enabled: true
  allow-offline-messages: true
  format-outgoing: "&8[&aЯ &7-> &f{target}&8] &7{message}"
  format-incoming: "&8[&f{sender} &7-> &aЯ&8] &7{message}"
  notify-unread-on-join: true

join-quit:
  enabled: true
  first-join:
    default: "&6✦ {player}"
    rules:
      - permission: "group.premium"
        format: "&d✦ &f{player} &dвпервые зашел на сервер!"
      - permission: "group.vip"
        format: "&b✦ &f{player} &bвпервые зашел на сервер!"
  join:
    default: "&a+ {player}"
    rules:
      - permission: "group.premium"
        format: "&d⬑ &f{player} &dзашел на сервер"
      - permission: "group.vip"
        format: "&b⬑ &f{player} &bзашел на сервер"
  quit:
    default: "&c- {player}"
    rules:
      - permission: "group.premium"
        format: "&d⬏ &f{player} &dвышел с сервера"
      - permission: "group.vip"
        format: "&b⬏ &f{player} &bвышел с сервера"

gui:
  main:
    title: "&8SopChat"
    items:
      channels:
        material: BOOK
        custom-model-data: 0
        name: "&dChannels"
        lore:
          - "&7Open your channels"
      invites:
        material: WRITABLE_BOOK
        custom-model-data: 0
        name: "&eInvites"
        lore:
          - "&7Open channel invites"
      private-messages:
        material: PAPER
        custom-model-data: 0
        name: "&bPrivate messages"
        lore:
          - "&7Private message hub"
      ignore-list:
        material: BARRIER
        custom-model-data: 0
        name: "&cIgnore list"
        lore:
          - "&7Manage ignored players"
  channels:
    title: "&8Your channels"
    empty:
      material: GRAY_STAINED_GLASS_PANE
      custom-model-data: 0
      name: "&7No channels yet"
      lore:
        - "&7Create one with &e/channel create <name>"
  invites:
    title: "&8Channel invites"
  private-messages:
    title: "&8Private messages"
    empty:
      material: GRAY_STAINED_GLASS_PANE
      custom-model-data: 0
      name: "&7No conversations yet"
      lore:
        - "&7Use &e/m <player> <message>"
    conversation-title: "&8Conversation: {player}"
  ignore-list:
    title: "&8Ignore list"
    empty:
      material: GRAY_STAINED_GLASS_PANE
      custom-model-data: 0
      name: "&7Nobody ignored"
      lore:
        - "&7Your ignore list is empty."
  channel-history:
    title: "&8Channel history: {channel}"
  shared:
    back:
      material: ARROW
      custom-model-data: 0
      name: "&aBack"
      lore:
        - "&7Return to the main menu"
    back-to-channels:
      material: ARROW
      custom-model-data: 0
      name: "&aBack"
      lore:
        - "&7Return to channels"
    back-to-private-messages:
      material: ARROW
      custom-model-data: 0
      name: "&aBack"
      lore:
        - "&7Return to private messages"
